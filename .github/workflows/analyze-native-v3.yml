name: Analyze native library v3

on:
  push:
    paths:
      - 'input/**/*.so'
      - 'ghidra_scripts/**'
      - 'tools/*.py'
      - '.github/workflows/analyze-native-v3.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Optional .so path under input/. Leave blank to analyze every .so in input/'
        required: false
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: Ghidra ARM64 deobfuscation analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 110

    env:
      GHIDRA_VERSION: '12.1.3'
      GHIDRA_ZIP: 'ghidra_12.1.3_PUBLIC_20260817.zip'
      GHIDRA_SHA256: '93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54'
      GHIDRA_URL: 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file unzip graphviz
          python -m pip install --disable-pip-version-check pyelftools

      - name: Cache Ghidra release archive
        uses: actions/cache@v5
        with:
          path: ~/.cache/mobile-ghidra/${{ env.GHIDRA_ZIP }}
          key: ghidra-${{ runner.os }}-${{ env.GHIDRA_VERSION }}-${{ env.GHIDRA_SHA256 }}

      - name: Download and verify Ghidra
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/mobile-ghidra" "$RUNNER_TEMP/ghidra"
          ZIP="$HOME/.cache/mobile-ghidra/$GHIDRA_ZIP"
          if [[ ! -f "$ZIP" ]]; then
            curl --fail --location --retry 3 --retry-delay 2 "$GHIDRA_URL" -o "$ZIP"
          fi
          echo "$GHIDRA_SHA256  $ZIP" | sha256sum --check -
          unzip -q "$ZIP" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_HOME="$RUNNER_TEMP/ghidra/ghidra_${GHIDRA_VERSION}_PUBLIC"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: Select libraries
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/targets.txt"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.target }}" ]]; then
            TARGET='${{ inputs.target }}'
            if [[ "$TARGET" != input/*.so && "$TARGET" != input/**/*.so ]]; then
              echo "Manual target must be a .so file under input/: $TARGET" >&2
              exit 2
            fi
            test -f "$TARGET"
            printf '%s\n' "$TARGET" >> "$RUNNER_TEMP/targets.txt"
          elif [[ "${{ github.event_name }}" == "push" ]] && git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'input/**/*.so' 'input/*.so' \
              | while IFS= read -r p; do
                  [[ -f "$p" && "$p" == *.so ]] && printf '%s\n' "$p"
                done >> "$RUNNER_TEMP/targets.txt"
          fi
          if [[ ! -s "$RUNNER_TEMP/targets.txt" ]]; then
            find input -type f -name '*.so' -print | sort >> "$RUNNER_TEMP/targets.txt"
          fi
          sort -u "$RUNNER_TEMP/targets.txt" -o "$RUNNER_TEMP/targets.txt"
          test -s "$RUNNER_TEMP/targets.txt" || { echo 'No .so files found under input/.' >&2; exit 3; }
          echo 'Selected targets:'
          cat "$RUNNER_TEMP/targets.txt"

      - name: Analyze libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output" "$RUNNER_TEMP/ghidra-projects"

          while IFS= read -r TARGET; do
            [[ -z "$TARGET" ]] && continue
            echo "::group::Analyzing $TARGET"

            SHA256="$(sha256sum "$TARGET" | awk '{print $1}')"
            SHORT_SHA="${SHA256:0:12}"
            BASE="$(basename "$TARGET")"
            SAFE_BASE="$(printf '%s' "$BASE" | tr -cs 'A-Za-z0-9._-' '_')"
            OUT="$GITHUB_WORKSPACE/output/${SAFE_BASE}-${SHORT_SHA}"
            mkdir -p "$OUT"
            printf '%s\n' "$TARGET" > "$OUT/source_path.txt"
            printf '%s\n' "$SHA256" > "$OUT/sha256.txt"

            # Stage 0: detect packing/encryption and recover conservative simple XOR wrappers.
            python "$GITHUB_WORKSPACE/tools/preflight_obfuscation.py" "$TARGET" "$OUT" \
              > "$OUT/preflight_obfuscation.log" 2>&1 || true

            ANALYZE_TARGET="$(head -n 1 "$OUT/analysis_target.txt" 2>/dev/null || true)"
            if [[ -z "$ANALYZE_TARGET" || ! -f "$ANALYZE_TARGET" ]]; then
              printf 'preflight-only: input is not a directly analyzable ELF; see preflight_obfuscation.md\n' > "$OUT/status.txt"
              printf 'not-run\n' > "$OUT/ghidra_exit_code.txt"
              echo 'No static ELF target recovered; runtime-unpack path may be required.'
              echo '::endgroup::'
              continue
            fi
            if [[ "$ANALYZE_TARGET" = /* ]]; then IMPORT_TARGET="$ANALYZE_TARGET"; else IMPORT_TARGET="$GITHUB_WORKSPACE/$ANALYZE_TARGET"; fi
            printf '%s\n' "$IMPORT_TARGET" > "$OUT/analysis_target_used.txt"

            # Stage 1: independent ELF evidence.
            file "$IMPORT_TARGET" > "$OUT/file.txt" 2>&1 || true
            readelf -h "$IMPORT_TARGET" > "$OUT/readelf_header.txt" 2>&1 || true
            readelf -lW "$IMPORT_TARGET" > "$OUT/readelf_segments.txt" 2>&1 || true
            readelf -SW "$IMPORT_TARGET" > "$OUT/readelf_sections.txt" 2>&1 || true
            readelf -dW "$IMPORT_TARGET" > "$OUT/readelf_dynamic.txt" 2>&1 || true
            readelf -rW "$IMPORT_TARGET" > "$OUT/readelf_relocations.txt" 2>&1 || true
            readelf -sW "$IMPORT_TARGET" > "$OUT/readelf_symbols.txt" 2>&1 || true
            readelf -nW "$IMPORT_TARGET" > "$OUT/readelf_notes.txt" 2>&1 || true
            readelf -VW "$IMPORT_TARGET" > "$OUT/readelf_versions.txt" 2>&1 || true
            nm -D -C "$IMPORT_TARGET" > "$OUT/nm_dynamic_all.txt" 2>&1 || true
            nm -D -C --defined-only "$IMPORT_TARGET" > "$OUT/exports.txt" 2>&1 || true
            nm -D -C --undefined-only "$IMPORT_TARGET" > "$OUT/imports.txt" 2>&1 || true
            objdump -p "$IMPORT_TARGET" > "$OUT/objdump_private_headers.txt" 2>&1 || true
            objdump -T -C "$IMPORT_TARGET" > "$OUT/objdump_dynamic_symbols.txt" 2>&1 || true
            objdump -d -C "$IMPORT_TARGET" > "$OUT/objdump_disassembly.txt" 2>&1 || true
            strings -a -n 4 "$IMPORT_TARGET" > "$OUT/raw_strings.txt" 2>&1 || true
            grep -Eai '(https?://|wss?://|[A-Za-z0-9.-]+\.(com|net|org|io|gg|app|dev)|JNI|RegisterNatives|AES|RSA|SHA[0-9]*|MD5|encrypt|decrypt|token|auth|login|password|socket|ssl|tls|certificate|debug|error|audio|voice|xhook|ptrace|frida|dlopen|dlsym)' \
              "$OUT/raw_strings.txt" > "$OUT/interesting_strings.txt" || true
            python "$GITHUB_WORKSPACE/tools/elf_report.py" "$IMPORT_TARGET" "$OUT/elf_metadata.json" \
              > "$OUT/elf_report.log" 2>&1 || true

            # Stage 2: Ghidra auto-analysis + pseudocode + IDA-like ARM64 listing.
            PROJECT_NAME="v3_${SHORT_SHA}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
            set +e
            "$GHIDRA_HOME/support/analyzeHeadless" \
              "$RUNNER_TEMP/ghidra-projects" "$PROJECT_NAME" \
              -import "$IMPORT_TARGET" \
              -scriptPath "$GITHUB_WORKSPACE/ghidra_scripts" \
              -analysisTimeoutPerFile 2700 \
              -postScript ExportAnalysis.java "$OUT" 12000 2700 10 \
              -postScript ExportIdaListing.java "$OUT" \
              -deleteProject \
              > "$OUT/ghidra_headless.log" 2>&1
            GHIDRA_RC=$?
            set -e
            printf '%s\n' "$GHIDRA_RC" > "$OUT/ghidra_exit_code.txt"
            if [[ "$GHIDRA_RC" -eq 0 ]]; then printf 'complete\n' > "$OUT/status.txt"; else printf 'partial (Ghidra exit code %s; inspect ghidra_headless.log)\n' "$GHIDRA_RC" > "$OUT/status.txt"; fi

            # Stage 3: behavior ranking, ARM64 obstruction metrics, library-noise suppression,
            # dispatcher/state heuristics, trampoline collapse and indirect-branch contexts.
            python "$GITHUB_WORKSPACE/tools/deep_report.py" "$OUT" > "$OUT/deep_report.log" 2>&1 || true
            python "$GITHUB_WORKSPACE/tools/arm64_obfuscation_report.py" "$OUT" > "$OUT/arm64_obfuscation_report.log" 2>&1 || true
            python "$GITHUB_WORKSPACE/tools/third_party_filter.py" "$OUT" > "$OUT/third_party_filter.log" 2>&1 || true
            python "$GITHUB_WORKSPACE/tools/arm64_deflatten_report.py" "$OUT" > "$OUT/arm64_deflatten_report.log" 2>&1 || true

            # Render simplified CFGs for phone viewing. Limit SVG count to avoid artifact bloat.
            mkdir -p "$OUT/arm64_deflatten_svg"
            count=0
            if [[ -d "$OUT/arm64_deflatten_dot" ]]; then
              while IFS= read -r dotfile; do
                [[ $count -ge 40 ]] && break
                name="$(basename "${dotfile%.dot}")"
                dot -Tsvg "$dotfile" -o "$OUT/arm64_deflatten_svg/${name}.svg" 2>/dev/null || true
                count=$((count+1))
              done < <(find "$OUT/arm64_deflatten_dot" -type f -name '*.dot' | sort)
            fi

            echo "Ghidra exit code: $GHIDRA_RC"
            echo "Output: $OUT"
            echo '::endgroup::'
          done < "$RUNNER_TEMP/targets.txt"

      - name: Build run manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('output'); entries = []
          if root.exists():
              for d in sorted(p for p in root.iterdir() if p.is_dir()):
                  def text(name):
                      p=d/name
                      return p.read_text(encoding='utf-8', errors='replace').strip() if p.exists() else None
                  entries.append({'result_dir':d.name,'source_path':text('source_path.txt'),'sha256':text('sha256.txt'),'status':text('status.txt'),'ghidra_exit_code':text('ghidra_exit_code.txt')})
          root.mkdir(exist_ok=True)
          (root/'run_manifest.json').write_text(json.dumps({
              'repository':os.environ.get('GITHUB_REPOSITORY'),'run_id':os.environ.get('GITHUB_RUN_ID'),
              'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'commit':os.environ.get('GITHUB_SHA'),
              'ghidra_version':os.environ.get('GHIDRA_VERSION'),
              'profile':'v3+packing+ida-like+third-party-filter+arm64-deflatten+indirect-flow',
              'results':entries}, indent=2), encoding='utf-8')
          PY

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Mobile Ghidra Lab v3'
            echo
            echo "Ghidra: **$GHIDRA_VERSION**"
            for d in output/*/; do
              [[ -d "$d" ]] || continue
              echo
              echo "## $(basename "$d")"
              [[ -f "${d}status.txt" ]] && echo "- Status: \`$(cat "${d}status.txt")\`"
              for report in preflight_obfuscation.md analysis_summary.md third_party_report.md arm64_obfuscation_report.md arm64_deflatten_report.md; do
                [[ -f "${d}${report}" ]] || continue
                echo
                sed -n '1,55p' "${d}${report}"
              done
              echo
              echo 'Key files: `analysis_priority.csv`, `arm64_deflatten/`, `arm64_deflatten_svg/`, `arm64_indirect_branches.csv`, `ida_like_functions/`, `decompiled_focus/`.'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ghidra-v3-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
