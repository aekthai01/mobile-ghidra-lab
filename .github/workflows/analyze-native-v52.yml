name: Analyze native library v5.2 protection-aware
on:
  push:
    paths:
      - 'input/**/*.so'
      - 'ghidra_scripts/**'
      - 'tools/v4_*.py'
      - 'tools/v5*.py'
      - 'tools/v52_*.sh'
      - '.github/workflows/analyze-native-v52.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Optional .so path under input/. Blank = largest library.'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: mobile-ghidra-v52-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GHIDRA_VERSION: '12.1.3'
      GHIDRA_ZIP: 'ghidra_12.1.3_PUBLIC_20260817.zip'
      GHIDRA_SHA256: '93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54'
      GHIDRA_URL: 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file unzip graphviz
          python -m pip install --disable-pip-version-check pyelftools
      - uses: actions/cache@v5
        with:
          path: ~/.cache/mobile-ghidra/${{ env.GHIDRA_ZIP }}
          key: ghidra-${{ runner.os }}-${{ env.GHIDRA_VERSION }}-${{ env.GHIDRA_SHA256 }}
      - name: Prepare Ghidra
        run: |
          mkdir -p "$HOME/.cache/mobile-ghidra" "$RUNNER_TEMP/ghidra"
          ZIP="$HOME/.cache/mobile-ghidra/$GHIDRA_ZIP"
          [[ -f "$ZIP" ]] || curl --fail --location --retry 3 "$GHIDRA_URL" -o "$ZIP"
          echo "$GHIDRA_SHA256  $ZIP" | sha256sum --check -
          unzip -q "$ZIP" -d "$RUNNER_TEMP/ghidra"
          echo "GHIDRA_HOME=$RUNNER_TEMP/ghidra/ghidra_${GHIDRA_VERSION}_PUBLIC" >> "$GITHUB_ENV"
      - name: V5.2 deep analysis
        env:
          MANUAL_TARGET: ${{ inputs.target || '' }}
        run: |
          set -euo pipefail
          TARGET="$MANUAL_TARGET"
          if [[ -z "$TARGET" ]]; then TARGET="$(find input -type f -name '*.so' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"; fi
          test -f "$TARGET"
          mkdir -p output "$RUNNER_TEMP/projects"
          SHA="$(sha256sum "$TARGET"|awk '{print $1}')"; SHORT="${SHA:0:12}"; BASE="$(basename "$TARGET")"
          OUT="$GITHUB_WORKSPACE/output/${BASE}-${SHORT}"; mkdir -p "$OUT"
          printf '%s\n' "$TARGET" > "$OUT/source_path.txt"; printf '%s\n' "$SHA" > "$OUT/sha256.txt"
          python tools/preflight_obfuscation.py "$TARGET" "$OUT" > "$OUT/preflight.log" 2>&1 || true
          ANALYZE="$(head -1 "$OUT/analysis_target.txt" 2>/dev/null || true)"
          [[ -n "$ANALYZE" && -f "$ANALYZE" ]] || { echo preflight-only > "$OUT/status.txt"; exit 0; }
          [[ "$ANALYZE" = /* ]] && IMPORT="$ANALYZE" || IMPORT="$GITHUB_WORKSPACE/$ANALYZE"
          file "$IMPORT" > "$OUT/file.txt"; readelf -lW "$IMPORT" > "$OUT/readelf_segments.txt" || true; readelf -SW "$IMPORT" > "$OUT/readelf_sections.txt" || true
          strings -a -n 4 "$IMPORT" > "$OUT/raw_strings.txt" || true; python tools/elf_report.py "$IMPORT" "$OUT/elf_metadata.json" || true
          PROJ="v52_${SHORT}_${GITHUB_RUN_ID}"; PROG="$(basename "$IMPORT")"
          bash tools/v52_inventory.sh "$GHIDRA_HOME" "$RUNNER_TEMP/projects" "$PROJ" "$IMPORT" "$OUT"
          bash tools/v52_select.sh "$OUT"
          bash tools/v52_selected.sh "$GHIDRA_HOME" "$RUNNER_TEMP/projects" "$PROJ" "$PROG" "$OUT"
          bash tools/v52_post.sh "$OUT" "$IMPORT"
          printf 'complete\n' > "$OUT/status.txt"
      - name: Summary
        if: always()
        run: |
          for d in output/*/; do
            echo '# Mobile Ghidra Lab V5.2' >> "$GITHUB_STEP_SUMMARY"
            [[ -f "${d}status.txt" ]] && echo "- Status: $(cat "${d}status.txt")" >> "$GITHUB_STEP_SUMMARY"
            for f in v52_priority.md v51_quality_report.md v52_indirect_expression_roles.md v52_protected_regions.md; do
              [[ -f "${d}${f}" ]] && { echo >> "$GITHUB_STEP_SUMMARY"; sed -n '1,55p' "${d}${f}" >> "$GITHUB_STEP_SUMMARY"; }
            done
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ghidra-v52-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
