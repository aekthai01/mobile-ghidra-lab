name: Analyze native library v5.1 deep flow recovery

on:
  push:
    paths:
      - 'input/**/*.so'
      - 'ghidra_scripts/ExportAnalysis.java'
      - 'ghidra_scripts/ExportV4Selected.java'
      - 'ghidra_scripts/ExportV51*.java'
      - 'tools/v4_select_targets.py'
      - 'tools/v4_callgraph.py'
      - 'tools/v5*.py'
      - 'tools/v51*.py'
      - 'tools/preflight_obfuscation.py'
      - 'tools/elf_report.py'
      - '.github/workflows/analyze-native-v5.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Optional .so path under input/. Blank = all libraries.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-ghidra-v51-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Select V5.1 targets
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: targets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          event=os.environ.get('GITHUB_EVENT_NAME',''); manual=os.environ.get('MANUAL_TARGET','').strip(); targets=[]
          if event=='workflow_dispatch' and manual:
              p=Path(manual)
              if not str(p).startswith('input/') or p.suffix!='.so' or not p.is_file(): raise SystemExit(f'invalid target: {manual}')
              targets=[str(p)]
          elif event=='workflow_dispatch':
              targets=[str(p) for p in sorted(Path('input').rglob('*.so'))]
          else:
              try: changed=subprocess.check_output(['git','diff','--name-only','--diff-filter=AM','HEAD^','HEAD','--','input'],text=True).splitlines()
              except Exception: changed=[]
              targets=[p for p in changed if p.endswith('.so') and Path(p).is_file()]
              if not targets:
                  libs=list(Path('input').rglob('*.so'))
                  if libs: targets=[str(max(libs,key=lambda p:p.stat().st_size))]
          targets=sorted(dict.fromkeys(targets))
          if not targets: raise SystemExit('no .so targets found')
          print('V5.1 targets:',*targets,sep='\n- ')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:f.write('targets='+json.dumps(targets,separators=(',',':'))+'\n')
          PY
        env:
          MANUAL_TARGET: ${{ inputs.target || '' }}

  analyze:
    name: V5.1 ${{ matrix.target }}
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: ${{ fromJson(needs.discover.outputs.targets) }}

    env:
      GHIDRA_VERSION: '12.1.3'
      GHIDRA_ZIP: 'ghidra_12.1.3_PUBLIC_20260817.zip'
      GHIDRA_SHA256: '93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54'
      GHIDRA_URL: 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file unzip graphviz
          python -m pip install --disable-pip-version-check pyelftools

      - name: Cache Ghidra
        uses: actions/cache@v5
        with:
          path: ~/.cache/mobile-ghidra/${{ env.GHIDRA_ZIP }}
          key: ghidra-${{ runner.os }}-${{ env.GHIDRA_VERSION }}-${{ env.GHIDRA_SHA256 }}

      - name: Download and verify Ghidra
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/mobile-ghidra" "$RUNNER_TEMP/ghidra"
          ZIP="$HOME/.cache/mobile-ghidra/$GHIDRA_ZIP"
          if [[ ! -f "$ZIP" ]]; then curl --fail --location --retry 3 --retry-delay 2 "$GHIDRA_URL" -o "$ZIP"; fi
          echo "$GHIDRA_SHA256  $ZIP" | sha256sum --check -
          unzip -q "$ZIP" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_HOME="$RUNNER_TEMP/ghidra/ghidra_${GHIDRA_VERSION}_PUBLIC"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: V5.1 inventory and deep selective analysis
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test -f "$TARGET"
          mkdir -p output "$RUNNER_TEMP/ghidra-projects"
          SHA256="$(sha256sum "$TARGET" | awk '{print $1}')"; SHORT_SHA="${SHA256:0:12}"
          BASE="$(basename "$TARGET")"; SAFE_BASE="$(printf '%s' "$BASE" | tr -cs 'A-Za-z0-9._-' '_')"
          OUT="$GITHUB_WORKSPACE/output/${SAFE_BASE}-${SHORT_SHA}"; mkdir -p "$OUT"
          printf '%s\n' "$TARGET" > "$OUT/source_path.txt"; printf '%s\n' "$SHA256" > "$OUT/sha256.txt"

          python tools/preflight_obfuscation.py "$TARGET" "$OUT" > "$OUT/preflight_obfuscation.log" 2>&1 || true
          ANALYZE_TARGET="$(head -n 1 "$OUT/analysis_target.txt" 2>/dev/null || true)"
          if [[ -z "$ANALYZE_TARGET" || ! -f "$ANALYZE_TARGET" ]]; then
            printf 'preflight-only: no static ELF recovered\n' > "$OUT/status.txt"; printf 'not-run\n' > "$OUT/ghidra_inventory_exit_code.txt"; exit 0
          fi
          if [[ "$ANALYZE_TARGET" = /* ]]; then IMPORT_TARGET="$ANALYZE_TARGET"; else IMPORT_TARGET="$GITHUB_WORKSPACE/$ANALYZE_TARGET"; fi
          printf '%s\n' "$IMPORT_TARGET" > "$OUT/analysis_target_used.txt"

          file "$IMPORT_TARGET" > "$OUT/file.txt" 2>&1 || true
          readelf -h "$IMPORT_TARGET" > "$OUT/readelf_header.txt" 2>&1 || true
          readelf -lW "$IMPORT_TARGET" > "$OUT/readelf_segments.txt" 2>&1 || true
          readelf -SW "$IMPORT_TARGET" > "$OUT/readelf_sections.txt" 2>&1 || true
          readelf -dW "$IMPORT_TARGET" > "$OUT/readelf_dynamic.txt" 2>&1 || true
          readelf -rW "$IMPORT_TARGET" > "$OUT/readelf_relocations.txt" 2>&1 || true
          readelf -sW "$IMPORT_TARGET" > "$OUT/readelf_symbols.txt" 2>&1 || true
          nm -D -C --defined-only "$IMPORT_TARGET" > "$OUT/exports.txt" 2>&1 || true
          nm -D -C --undefined-only "$IMPORT_TARGET" > "$OUT/imports.txt" 2>&1 || true
          strings -a -n 4 "$IMPORT_TARGET" > "$OUT/raw_strings.txt" 2>&1 || true
          python tools/elf_report.py "$IMPORT_TARGET" "$OUT/elf_metadata.json" > "$OUT/elf_report.log" 2>&1 || true

          PROJECT_NAME="v51_${SHORT_SHA}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${{ strategy.job-index }}"; PROGRAM_NAME="$(basename "$IMPORT_TARGET")"
          set +e
          "$GHIDRA_HOME/support/analyzeHeadless" "$RUNNER_TEMP/ghidra-projects" "$PROJECT_NAME" \
            -import "$IMPORT_TARGET" -scriptPath "$GITHUB_WORKSPACE/ghidra_scripts" -analysisTimeoutPerFile 1800 \
            -postScript ExportAnalysis.java "$OUT" 0 60 1 \
            -postScript ExportV51Refs.java "$OUT" \
            > "$OUT/ghidra_inventory.log" 2>&1
          INV_RC=$?; set -e
          if [[ "$INV_RC" -eq 0 && ! -s "$OUT/functions.csv" ]]; then INV_RC=96; fi
          if [[ "$INV_RC" -eq 0 && ! -s "$OUT/v51_function_refs.csv" ]]; then INV_RC=94; fi
          if grep -Eqi 'SCRIPT ERROR|class could not be found|error:.*ExportAnalysis|error:.*ExportV51Refs' "$OUT/ghidra_inventory.log"; then INV_RC=95; fi
          printf '%s\n' "$INV_RC" > "$OUT/ghidra_inventory_exit_code.txt"
          if [[ "$INV_RC" -ne 0 ]]; then printf 'partial: inventory validation failed (%s)\n' "$INV_RC" > "$OUT/status.txt"; exit 21; fi

          python tools/v4_select_targets.py "$OUT" > "$OUT/v5_select_targets.log" 2>&1
          cp "$OUT/v4_selected_functions.csv" "$OUT/v4_selected_functions_original.csv"
          python tools/v51_rank_targets.py "$OUT" > "$OUT/v51_rank_targets.log" 2>&1
          test -s "$OUT/v51_selected_functions.csv"
          cp "$OUT/v51_selected_functions.csv" "$OUT/v5_selected_functions.csv"
          cp "$OUT/v51_selected_functions.csv" "$OUT/v4_selected_functions.csv"

          set +e
          "$GHIDRA_HOME/support/analyzeHeadless" "$RUNNER_TEMP/ghidra-projects" "$PROJECT_NAME" \
            -process "$PROGRAM_NAME" -noanalysis -scriptPath "$GITHUB_WORKSPACE/ghidra_scripts" \
            -postScript ExportV4Selected.java "$OUT" "$OUT/v51_selected_functions.csv" 1500 10 \
            -postScript ExportV51RawPcode.java "$OUT" "$OUT/v51_selected_functions.csv" 220 8000 22000 1400000 \
            -postScript ExportV51HighPcode.java "$OUT" "$OUT/v51_selected_functions.csv" 120 12 40000 1000000 \
            -deleteProject > "$OUT/ghidra_selected_v51.log" 2>&1
          SEL_RC=$?; set -e
          if [[ "$SEL_RC" -eq 0 && ! -s "$OUT/v4_selected_export.csv" ]]; then SEL_RC=97; fi
          if [[ "$SEL_RC" -eq 0 && ! -s "$OUT/v51_raw_pcode.csv" ]]; then SEL_RC=99; fi
          if [[ "$SEL_RC" -eq 0 && ! -s "$OUT/v51_high_pcode_summary.csv" ]]; then SEL_RC=93; fi
          if grep -Eqi 'SCRIPT ERROR|class could not be found|attempting to assign weaker access|error:.*ExportV4Selected|error:.*ExportV51' "$OUT/ghidra_selected_v51.log"; then SEL_RC=98; fi
          printf '%s\n' "$SEL_RC" > "$OUT/ghidra_selected_v51_exit_code.txt"
          if [[ "$SEL_RC" -ne 0 ]]; then printf 'partial: V5.1 selected/P-code exporter validation failed (%s)\n' "$SEL_RC" > "$OUT/status.txt"; exit 22; fi

          python tools/v5_arm64_flow.py "$OUT" "$IMPORT_TARGET" > "$OUT/v5_arm64_flow.log" 2>&1
          test -s "$OUT/v5_function_flow.csv"; test -s "$OUT/v5_indirect_branches.csv"; test -s "$OUT/v5_flow_report.json"
          python tools/v5_validate_tables.py "$OUT" > "$OUT/v5_validate_tables.log" 2>&1
          test -s "$OUT/v5_jump_table_validation.csv"; test -s "$OUT/v5_jump_table_validation.json"
          python tools/v51_high_pcode_slices.py "$OUT" > "$OUT/v51_high_pcode_slices.log" 2>&1
          test -s "$OUT/v51_high_pcode_indirect_slices.csv"
          python tools/v51_runtime_tables.py "$OUT" > "$OUT/v51_runtime_tables.log" 2>&1
          test -s "$OUT/v51_table_writer_candidates.csv"; test -s "$OUT/v51_runtime_table_probe.js"
          python tools/v51_quality.py "$OUT" > "$OUT/v51_quality.log" 2>&1
          test -s "$OUT/v51_quality_report.md"

          python tools/v4_callgraph.py "$OUT" > "$OUT/v51_callgraph.log" 2>&1 || true
          if [[ -f "$OUT/v4_selected_callgraph.dot" ]]; then
            cp "$OUT/v4_selected_callgraph.dot" "$OUT/v51_selected_callgraph.dot"
            timeout 15s dot -Tsvg "$OUT/v51_selected_callgraph.dot" -o "$OUT/v51_selected_callgraph.svg" 2>"$OUT/v51_graphviz.log" || true
          fi
          python tools/v51_ai_context.py "$OUT" > "$OUT/v51_ai_context.log" 2>&1
          test -s "$OUT/ai_context_v51/overview.md"
          printf 'complete\n' > "$OUT/status.txt"

      - name: Publish V5.1 summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Mobile Ghidra Lab V5.1'
            for d in output/*/; do
              [[ -d "$d" ]] || continue
              echo; echo "## $(basename "$d")"
              [[ -f "${d}status.txt" ]] && echo "- Status: \`$(cat "${d}status.txt")\`"
              for f in v51_ranking.md v51_quality_report.md v51_high_pcode_report.md v51_high_pcode_slices_report.md v51_runtime_table_report.md; do
                [[ -f "${d}${f}" ]] && { echo; sed -n '1,55p' "${d}${f}"; }
              done
              echo; echo 'Start with `ai_context_v51/overview.md`, then `v51_ranking.md`, `v51_high_pcode_slices/`, `v51_dispatcher_app.csv`, and `v51_runtime_table_probe.js` when static table bytes are invalid.'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V5.1 artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ghidra-v51-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
