name: Analyze native library v5 flow recovery

on:
  push:
    paths:
      - 'input/**/*.so'
      - 'ghidra_scripts/ExportAnalysis.java'
      - 'ghidra_scripts/ExportV4Selected.java'
      - 'ghidra_scripts/ExportV5Pcode.java'
      - 'tools/v4_select_targets.py'
      - 'tools/v4_callgraph.py'
      - 'tools/v5_*.py'
      - 'tools/preflight_obfuscation.py'
      - 'tools/elf_report.py'
      - '.github/workflows/analyze-native-v5.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Optional .so path under input/. Blank = all libraries.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-ghidra-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Select V5 targets
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: targets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          event = os.environ.get('GITHUB_EVENT_NAME', '')
          manual = os.environ.get('MANUAL_TARGET', '').strip()
          targets = []

          if event == 'workflow_dispatch' and manual:
              p = Path(manual)
              if not str(p).startswith('input/') or p.suffix != '.so' or not p.is_file():
                  raise SystemExit(f'invalid target: {manual}')
              targets = [str(p)]
          elif event == 'workflow_dispatch':
              targets = [str(p) for p in sorted(Path('input').rglob('*.so'))]
          else:
              try:
                  changed = subprocess.check_output([
                      'git','diff','--name-only','--diff-filter=AM','HEAD^','HEAD','--','input'
                  ], text=True).splitlines()
              except Exception:
                  changed = []
              targets = [p for p in changed if p.endswith('.so') and Path(p).is_file()]
              if not targets:
                  libs = list(Path('input').rglob('*.so'))
                  if libs:
                      targets = [str(max(libs, key=lambda p: p.stat().st_size))]

          targets = sorted(dict.fromkeys(targets))
          if not targets:
              raise SystemExit('no .so targets found')
          print('V5 targets:', *targets, sep='\n- ')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('targets=' + json.dumps(targets, separators=(',', ':')) + '\n')
          PY
        env:
          MANUAL_TARGET: ${{ inputs.target || '' }}

  analyze:
    name: V5 ${{ matrix.target }}
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: ${{ fromJson(needs.discover.outputs.targets) }}

    env:
      GHIDRA_VERSION: '12.1.3'
      GHIDRA_ZIP: 'ghidra_12.1.3_PUBLIC_20260817.zip'
      GHIDRA_SHA256: '93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54'
      GHIDRA_URL: 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file unzip graphviz
          python -m pip install --disable-pip-version-check pyelftools

      - name: Cache Ghidra
        uses: actions/cache@v5
        with:
          path: ~/.cache/mobile-ghidra/${{ env.GHIDRA_ZIP }}
          key: ghidra-${{ runner.os }}-${{ env.GHIDRA_VERSION }}-${{ env.GHIDRA_SHA256 }}

      - name: Download and verify Ghidra
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/mobile-ghidra" "$RUNNER_TEMP/ghidra"
          ZIP="$HOME/.cache/mobile-ghidra/$GHIDRA_ZIP"
          if [[ ! -f "$ZIP" ]]; then
            curl --fail --location --retry 3 --retry-delay 2 "$GHIDRA_URL" -o "$ZIP"
          fi
          echo "$GHIDRA_SHA256  $ZIP" | sha256sum --check -
          unzip -q "$ZIP" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_HOME="$RUNNER_TEMP/ghidra/ghidra_${GHIDRA_VERSION}_PUBLIC"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: V5 inventory and selective analysis
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test -f "$TARGET"
          mkdir -p output "$RUNNER_TEMP/ghidra-projects"

          SHA256="$(sha256sum "$TARGET" | awk '{print $1}')"
          SHORT_SHA="${SHA256:0:12}"
          BASE="$(basename "$TARGET")"
          SAFE_BASE="$(printf '%s' "$BASE" | tr -cs 'A-Za-z0-9._-' '_')"
          OUT="$GITHUB_WORKSPACE/output/${SAFE_BASE}-${SHORT_SHA}"
          mkdir -p "$OUT"
          printf '%s\n' "$TARGET" > "$OUT/source_path.txt"
          printf '%s\n' "$SHA256" > "$OUT/sha256.txt"

          python tools/preflight_obfuscation.py "$TARGET" "$OUT" > "$OUT/preflight_obfuscation.log" 2>&1 || true
          ANALYZE_TARGET="$(head -n 1 "$OUT/analysis_target.txt" 2>/dev/null || true)"
          if [[ -z "$ANALYZE_TARGET" || ! -f "$ANALYZE_TARGET" ]]; then
            printf 'preflight-only: no static ELF recovered\n' > "$OUT/status.txt"
            printf 'not-run\n' > "$OUT/ghidra_inventory_exit_code.txt"
            exit 0
          fi
          if [[ "$ANALYZE_TARGET" = /* ]]; then IMPORT_TARGET="$ANALYZE_TARGET"; else IMPORT_TARGET="$GITHUB_WORKSPACE/$ANALYZE_TARGET"; fi
          printf '%s\n' "$IMPORT_TARGET" > "$OUT/analysis_target_used.txt"

          file "$IMPORT_TARGET" > "$OUT/file.txt" 2>&1 || true
          readelf -h "$IMPORT_TARGET" > "$OUT/readelf_header.txt" 2>&1 || true
          readelf -lW "$IMPORT_TARGET" > "$OUT/readelf_segments.txt" 2>&1 || true
          readelf -SW "$IMPORT_TARGET" > "$OUT/readelf_sections.txt" 2>&1 || true
          readelf -dW "$IMPORT_TARGET" > "$OUT/readelf_dynamic.txt" 2>&1 || true
          readelf -rW "$IMPORT_TARGET" > "$OUT/readelf_relocations.txt" 2>&1 || true
          readelf -sW "$IMPORT_TARGET" > "$OUT/readelf_symbols.txt" 2>&1 || true
          nm -D -C --defined-only "$IMPORT_TARGET" > "$OUT/exports.txt" 2>&1 || true
          nm -D -C --undefined-only "$IMPORT_TARGET" > "$OUT/imports.txt" 2>&1 || true
          strings -a -n 4 "$IMPORT_TARGET" > "$OUT/raw_strings.txt" 2>&1 || true
          python tools/elf_report.py "$IMPORT_TARGET" "$OUT/elf_metadata.json" > "$OUT/elf_report.log" 2>&1 || true

          PROJECT_NAME="v5_${SHORT_SHA}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${{ strategy.job-index }}"
          PROGRAM_NAME="$(basename "$IMPORT_TARGET")"
          set +e
          "$GHIDRA_HOME/support/analyzeHeadless" \
            "$RUNNER_TEMP/ghidra-projects" "$PROJECT_NAME" \
            -import "$IMPORT_TARGET" \
            -scriptPath "$GITHUB_WORKSPACE/ghidra_scripts" \
            -analysisTimeoutPerFile 1800 \
            -postScript ExportAnalysis.java "$OUT" 0 60 1 \
            > "$OUT/ghidra_inventory.log" 2>&1
          INV_RC=$?
          set -e
          if [[ "$INV_RC" -eq 0 && ! -s "$OUT/functions.csv" ]]; then INV_RC=96; fi
          if grep -Eqi 'SCRIPT ERROR|class could not be found|error:.*ExportAnalysis' "$OUT/ghidra_inventory.log"; then INV_RC=95; fi
          printf '%s\n' "$INV_RC" > "$OUT/ghidra_inventory_exit_code.txt"
          if [[ "$INV_RC" -ne 0 ]]; then
            printf 'partial: inventory validation failed (%s)\n' "$INV_RC" > "$OUT/status.txt"
            exit 21
          fi

          python tools/v4_select_targets.py "$OUT" > "$OUT/v5_select_targets.log" 2>&1
          cp "$OUT/v4_selected_functions.csv" "$OUT/v5_selected_functions.csv"
          cp "$OUT/v4_function_metrics.csv" "$OUT/v5_selection_metrics.csv"
          cp "$OUT/v4_triage.md" "$OUT/v5_selection_report.md"
          test -s "$OUT/v5_selected_functions.csv"

          set +e
          "$GHIDRA_HOME/support/analyzeHeadless" \
            "$RUNNER_TEMP/ghidra-projects" "$PROJECT_NAME" \
            -process "$PROGRAM_NAME" \
            -noanalysis \
            -scriptPath "$GITHUB_WORKSPACE/ghidra_scripts" \
            -postScript ExportV4Selected.java "$OUT" "$OUT/v5_selected_functions.csv" 900 7 \
            -postScript ExportV5Pcode.java "$OUT" "$OUT/v5_selected_functions.csv" 80 9000 350000 \
            -deleteProject \
            > "$OUT/ghidra_selected_v5.log" 2>&1
          SEL_RC=$?
          set -e
          if [[ "$SEL_RC" -eq 0 && ! -s "$OUT/v4_selected_export.csv" ]]; then SEL_RC=97; fi
          if [[ "$SEL_RC" -eq 0 && ! -s "$OUT/v5_pcode.csv" ]]; then SEL_RC=99; fi
          if grep -Eqi 'SCRIPT ERROR|class could not be found|attempting to assign weaker access|error:.*ExportV4Selected|error:.*ExportV5Pcode' "$OUT/ghidra_selected_v5.log"; then SEL_RC=98; fi
          printf '%s\n' "$SEL_RC" > "$OUT/ghidra_selected_v5_exit_code.txt"
          if [[ "$SEL_RC" -ne 0 ]]; then
            printf 'partial: V5 selected/P-code exporter validation failed (%s)\n' "$SEL_RC" > "$OUT/status.txt"
            exit 22
          fi

          python tools/v5_arm64_flow.py "$OUT" "$IMPORT_TARGET" > "$OUT/v5_arm64_flow.log" 2>&1
          test -s "$OUT/v5_function_flow.csv"
          test -s "$OUT/v5_indirect_branches.csv"
          test -s "$OUT/v5_flow_report.json"

          # A table-shaped ARM64 sequence is not automatically a recovered table. Validate decoded
          # targets against actual 4-byte-aligned Ghidra instruction addresses before claiming it.
          python tools/v5_validate_tables.py "$OUT" > "$OUT/v5_validate_tables.log" 2>&1
          test -s "$OUT/v5_jump_table_validation.csv"
          test -s "$OUT/v5_jump_table_validation.json"

          # Backward-slice raw P-code at computed branches. This makes register/value construction
          # readable even when static table bytes were encrypted or initialized only at runtime.
          python tools/v5_pcode_slices.py "$OUT" > "$OUT/v5_pcode_slices.log" 2>&1
          test -s "$OUT/v5_pcode_indirect_slices.csv"

          python tools/v4_callgraph.py "$OUT" > "$OUT/v5_callgraph.log" 2>&1 || true
          if [[ -f "$OUT/v4_selected_callgraph.dot" ]]; then
            cp "$OUT/v4_selected_callgraph.dot" "$OUT/v5_selected_callgraph.dot"
            timeout 12s dot -Tsvg "$OUT/v5_selected_callgraph.dot" -o "$OUT/v5_selected_callgraph.svg" 2>"$OUT/v5_graphviz.log" || true
          fi

          python tools/v5_ai_context.py "$OUT" > "$OUT/v5_ai_context.log" 2>&1
          test -s "$OUT/ai_context/overview.md"

          printf 'complete\n' > "$OUT/status.txt"

      - name: Publish V5 summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Mobile Ghidra Lab V5'
            for d in output/*/; do
              [[ -d "$d" ]] || continue
              echo
              echo "## $(basename "$d")"
              [[ -f "${d}status.txt" ]] && echo "- Status: \`$(cat "${d}status.txt")\`"
              [[ -f "${d}preflight_obfuscation.md" ]] && { echo; sed -n '1,28p' "${d}preflight_obfuscation.md"; }
              [[ -f "${d}v5_selection_report.md" ]] && { echo; sed -n '1,45p' "${d}v5_selection_report.md"; }
              [[ -f "${d}v5_flow_report.md" ]] && { echo; sed -n '1,55p' "${d}v5_flow_report.md"; }
              [[ -f "${d}v5_jump_table_validation.md" ]] && { echo; sed -n '1,45p' "${d}v5_jump_table_validation.md"; }
              [[ -f "${d}v5_pcode_report.md" ]] && { echo; sed -n '1,30p' "${d}v5_pcode_report.md"; }
              [[ -f "${d}v5_pcode_slices_report.md" ]] && { echo; sed -n '1,35p' "${d}v5_pcode_slices_report.md"; }
              echo
              echo 'V5 key outputs: `ai_context/overview.md`, `v5_jump_table_validation.csv`, `v5_runtime_table_candidates.csv`, `v5_pcode_indirect_slices.csv`, `v5_state_values.csv`, `v5_clean_edges.csv`, `v5_slices/`, and `v5_pcode.csv`.'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V5 artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ghidra-v5-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
