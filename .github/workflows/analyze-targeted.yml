name: Analyze native library (targeted)

# Fast path for big libraries: one Ghidra import, decompile only the functions you list.
# Typical use: a 100MB+ .so where the full V5.6 all-function pass costs hours.
on:
  workflow_dispatch:
    inputs:
      target:
        description: '.so path under input/ (blank = largest)'
        required: false
        type: string
      targets:
        description: 'One per line: 0xVA | rva:HEX | foff:HEX | name:SYMBOL | re:REGEX (blank = top exported symbols)'
        required: false
        type: string
      analysis_timeout:
        description: 'Per-file Ghidra analysis timeout (seconds)'
        required: false
        default: '600'
        type: string
      max_functions:
        description: 'Hard cap on decompiled functions'
        required: false
        default: '200'
        type: string
      maxmem:
        description: 'JVM heap for analyzeHeadless'
        required: false
        default: '10G'
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-ghidra-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GHIDRA_VERSION: '12.1.3'
      GHIDRA_ZIP: 'ghidra_12.1.3_PUBLIC_20260817.zip'
      GHIDRA_SHA256: '93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54'
      GHIDRA_URL: 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip'

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file unzip
      - uses: actions/cache@v5
        with:
          path: ~/.cache/mobile-ghidra/${{ env.GHIDRA_ZIP }}
          key: ghidra-${{ runner.os }}-${{ env.GHIDRA_VERSION }}-${{ env.GHIDRA_SHA256 }}
      - name: Prepare Ghidra
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/mobile-ghidra" "$RUNNER_TEMP/ghidra"
          ZIP="$HOME/.cache/mobile-ghidra/$GHIDRA_ZIP"
          [[ -f "$ZIP" ]] || curl --fail --location --retry 3 --retry-delay 2 "$GHIDRA_URL" -o "$ZIP"
          echo "$GHIDRA_SHA256  $ZIP" | sha256sum --check -
          unzip -q "$ZIP" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_HOME="$RUNNER_TEMP/ghidra/ghidra_${GHIDRA_VERSION}_PUBLIC"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
      - name: Select target and build function list
        env:
          MANUAL_TARGET: ${{ inputs.target || '' }}
          TARGET_LINES: ${{ inputs.targets || '' }}
        run: |
          set -euo pipefail
          TARGET="$MANUAL_TARGET"
          if [[ -n "$TARGET" ]]; then
            [[ "$TARGET" == input/* && "$TARGET" == *.so ]] || { echo "target must be under input/ and end in .so" >&2; exit 2; }
            test -f "$TARGET"
          else
            TARGET="$(find input -type f -name '*.so' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          fi
          test -f "$TARGET"
          SHA="$(sha256sum "$TARGET" | awk '{print $1}')"
          SHORT="${SHA:0:12}"
          SAFE_BASE="$(basename "$TARGET" | tr -cs 'A-Za-z0-9._-' '_')"
          OUT="$GITHUB_WORKSPACE/output/${SAFE_BASE}-${SHORT}"
          mkdir -p "$OUT"
          printf '%s\n' "$TARGET" > "$OUT/source_path.txt"
          printf '%s\n' "$SHA" > "$OUT/sha256.txt"
          if [[ -n "$TARGET_LINES" ]]; then
            printf '%s\n' "$TARGET_LINES" > "$OUT/targets.txt"
          else
            # default: exported functions, first 25 names (keeps the run short)
            nm -D --defined-only "$TARGET" 2>/dev/null | awk '$2 ~ /^[TW]$/ {print "name:"$3}' | head -25 > "$OUT/targets.txt" || true
          fi
          test -s "$OUT/targets.txt" || { echo "empty target list" >&2; exit 2; }
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "IMPORT=$GITHUB_WORKSPACE/$TARGET" >> "$GITHUB_ENV"
      - name: Targeted analysis
        env:
          MGL_ANALYSIS_TIMEOUT: ${{ inputs.analysis_timeout }}
          MGL_MAX_FUNCTIONS: ${{ inputs.max_functions }}
          MGL_MAXMEM: ${{ inputs.maxmem }}
        run: |
          set -euo pipefail
          PROJECT="targeted_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          bash tools/run_targeted.sh "$GHIDRA_HOME" "$RUNNER_TEMP/projects" "$PROJECT" "$IMPORT" "$OUT" "$OUT/targets.txt"
      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          echo '# Mobile Ghidra Lab — targeted' >> "$GITHUB_STEP_SUMMARY"
          for d in output/*/; do
            [[ -d "$d" ]] || continue
            echo "- target: $(cat "${d}source_path.txt" 2>/dev/null)" >> "$GITHUB_STEP_SUMMARY"
            echo "- sha256: $(cat "${d}sha256.txt" 2>/dev/null)" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '## Stage timings' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "${d}stage_times.tsv" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '## Target results' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -60 "${d}targeted_index.csv" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload targeted artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ghidra-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/*/targeted/
            output/*/targeted_index.csv
            output/*/targeted/summary.txt
            output/*/targets.txt
            output/*/stage_times.tsv
            output/*/ghidra_targeted.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
