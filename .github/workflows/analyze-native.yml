name: Analyze native library

on:
  push:
    paths:
      - 'input/**/*.so'
  workflow_dispatch:
    inputs:
      target:
        description: 'Optional .so path, e.g. input/libgvraudio.so. Leave blank to analyze every .so in input/'
        required: false
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: Ghidra headless analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GHIDRA_VERSION: '12.1.3'
      GHIDRA_ZIP: 'ghidra_12.1.3_PUBLIC_20260817.zip'
      GHIDRA_SHA256: '93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54'
      GHIDRA_URL: 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file unzip
          python -m pip install --disable-pip-version-check pyelftools

      - name: Cache Ghidra release archive
        id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/mobile-ghidra/${{ env.GHIDRA_ZIP }}
          key: ghidra-${{ runner.os }}-${{ env.GHIDRA_VERSION }}-${{ env.GHIDRA_SHA256 }}

      - name: Download and verify Ghidra
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/mobile-ghidra" "$RUNNER_TEMP/ghidra"
          ZIP="$HOME/.cache/mobile-ghidra/$GHIDRA_ZIP"
          if [[ ! -f "$ZIP" ]]; then
            curl --fail --location --retry 3 --retry-delay 2 "$GHIDRA_URL" -o "$ZIP"
          fi
          echo "$GHIDRA_SHA256  $ZIP" | sha256sum --check -
          unzip -q "$ZIP" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_HOME="$RUNNER_TEMP/ghidra/ghidra_${GHIDRA_VERSION}_PUBLIC"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: Select libraries for this run
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/targets.txt"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.target }}" ]]; then
            TARGET='${{ inputs.target }}'
            if [[ "$TARGET" != input/*.so && "$TARGET" != input/**/*.so ]]; then
              echo "Manual target must be a .so file under input/: $TARGET" >&2
              exit 2
            fi
            if [[ ! -f "$TARGET" ]]; then
              echo "Target does not exist: $TARGET" >&2
              exit 2
            fi
            printf '%s\n' "$TARGET" >> "$RUNNER_TEMP/targets.txt"
          elif [[ "${{ github.event_name }}" == "push" ]] && git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'input/**/*.so' 'input/*.so' \
              | while IFS= read -r p; do
                  [[ -f "$p" && "$p" == *.so ]] && printf '%s\n' "$p"
                done >> "$RUNNER_TEMP/targets.txt"
          else
            find input -type f -name '*.so' -print | sort >> "$RUNNER_TEMP/targets.txt"
          fi

          # If Git's pathspec missed a mobile-web upload edge case, fall back to all inputs.
          if [[ ! -s "$RUNNER_TEMP/targets.txt" ]]; then
            find input -type f -name '*.so' -print | sort >> "$RUNNER_TEMP/targets.txt"
          fi

          sort -u "$RUNNER_TEMP/targets.txt" -o "$RUNNER_TEMP/targets.txt"
          if [[ ! -s "$RUNNER_TEMP/targets.txt" ]]; then
            echo 'No .so files found under input/.' >&2
            exit 3
          fi

          echo 'Selected targets:'
          cat "$RUNNER_TEMP/targets.txt"

      - name: Analyze libraries
        id: analyze
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output" "$RUNNER_TEMP/ghidra-projects"

          while IFS= read -r TARGET; do
            [[ -z "$TARGET" ]] && continue
            echo "::group::Analyzing $TARGET"

            SHA256="$(sha256sum "$TARGET" | awk '{print $1}')"
            SHORT_SHA="${SHA256:0:12}"
            BASE="$(basename "$TARGET")"
            SAFE_BASE="$(printf '%s' "$BASE" | tr -cs 'A-Za-z0-9._-' '_')"
            OUT="$GITHUB_WORKSPACE/output/${SAFE_BASE}-${SHORT_SHA}"
            mkdir -p "$OUT"

            printf '%s\n' "$TARGET" > "$OUT/source_path.txt"
            printf '%s\n' "$SHA256" > "$OUT/sha256.txt"

            file "$TARGET" > "$OUT/file.txt" 2>&1 || true
            readelf -h "$TARGET" > "$OUT/readelf_header.txt" 2>&1 || true
            readelf -lW "$TARGET" > "$OUT/readelf_segments.txt" 2>&1 || true
            readelf -SW "$TARGET" > "$OUT/readelf_sections.txt" 2>&1 || true
            readelf -dW "$TARGET" > "$OUT/readelf_dynamic.txt" 2>&1 || true
            readelf -rW "$TARGET" > "$OUT/readelf_relocations.txt" 2>&1 || true
            readelf -sW "$TARGET" > "$OUT/readelf_symbols.txt" 2>&1 || true
            readelf -nW "$TARGET" > "$OUT/readelf_notes.txt" 2>&1 || true
            readelf -VW "$TARGET" > "$OUT/readelf_versions.txt" 2>&1 || true
            nm -D -C "$TARGET" > "$OUT/nm_dynamic_all.txt" 2>&1 || true
            nm -D -C --defined-only "$TARGET" > "$OUT/exports.txt" 2>&1 || true
            nm -D -C --undefined-only "$TARGET" > "$OUT/imports.txt" 2>&1 || true
            objdump -p "$TARGET" > "$OUT/objdump_private_headers.txt" 2>&1 || true
            objdump -T -C "$TARGET" > "$OUT/objdump_dynamic_symbols.txt" 2>&1 || true
            objdump -d -C "$TARGET" > "$OUT/objdump_disassembly.txt" 2>&1 || true
            strings -a -n 4 "$TARGET" > "$OUT/raw_strings.txt" 2>&1 || true
            grep -Eai '(https?://|wss?://|[A-Za-z0-9.-]+\.(com|net|org|io|gg|app|dev)|JNI|RegisterNatives|AES|RSA|SHA[0-9]*|MD5|encrypt|decrypt|token|auth|login|password|socket|ssl|tls|certificate|debug|error|audio|voice)' \
              "$OUT/raw_strings.txt" | head -n 20000 > "$OUT/interesting_strings.txt" || true

            python "$GITHUB_WORKSPACE/tools/elf_report.py" "$TARGET" "$OUT/elf_metadata.json" \
              > "$OUT/elf_report.log" 2>&1 || true

            PROJECT_NAME="lab_${SHORT_SHA}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
            set +e
            "$GHIDRA_HOME/support/analyzeHeadless" \
              "$RUNNER_TEMP/ghidra-projects" "$PROJECT_NAME" \
              -import "$GITHUB_WORKSPACE/$TARGET" \
              -scriptPath "$GITHUB_WORKSPACE/ghidra_scripts" \
              -analysisTimeoutPerFile 1200 \
              -postScript ExportAnalysis.java "$OUT" 2500 1200 8 \
              -deleteProject \
              > "$OUT/ghidra_headless.log" 2>&1
            GHIDRA_RC=$?
            set -e
            printf '%s\n' "$GHIDRA_RC" > "$OUT/ghidra_exit_code.txt"

            if [[ "$GHIDRA_RC" -eq 0 ]]; then
              printf 'complete\n' > "$OUT/status.txt"
            else
              printf 'partial (Ghidra exit code %s; inspect ghidra_headless.log)\n' "$GHIDRA_RC" > "$OUT/status.txt"
            fi

            echo "Ghidra exit code: $GHIDRA_RC"
            echo "Output: $OUT"
            echo '::endgroup::'
          done < "$RUNNER_TEMP/targets.txt"

      - name: Build run manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('output')
          entries = []
          if root.exists():
              for d in sorted(p for p in root.iterdir() if p.is_dir()):
                  def text(name):
                      p = d / name
                      return p.read_text(encoding='utf-8', errors='replace').strip() if p.exists() else None
                  entries.append({
                      'result_dir': d.name,
                      'source_path': text('source_path.txt'),
                      'sha256': text('sha256.txt'),
                      'status': text('status.txt'),
                      'ghidra_exit_code': text('ghidra_exit_code.txt'),
                  })
          manifest = {
              'repository': os.environ.get('GITHUB_REPOSITORY'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'commit': os.environ.get('GITHUB_SHA'),
              'ghidra_version': os.environ.get('GHIDRA_VERSION'),
              'results': entries,
          }
          root.mkdir(exist_ok=True)
          (root / 'run_manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Mobile Ghidra Lab'
            echo
            echo "Ghidra: **$GHIDRA_VERSION**"
            echo
            if [[ -d output ]]; then
              for d in output/*/; do
                [[ -d "$d" ]] || continue
                echo "## $(basename "$d")"
                if [[ -f "${d}status.txt" ]]; then
                  echo "- Status: \`$(cat "${d}status.txt")\`"
                fi
                if [[ -f "${d}analysis_summary.md" ]]; then
                  echo
                  cat "${d}analysis_summary.md"
                fi
                echo
              done
            fi
            echo 'Download the artifact below this workflow run for the full reports.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
          retention-days: 5
          compression-level: 9
