name: Autopatch CI

on:
  push:
    branches:
      - autopatch-ci
    paths:
      - 'autopatch/**'
      - '.github/workflows/autopatch-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autopatch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-autopatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyelftools capstone

      - name: Reconstruct exact v4 and standalone v5
        shell: bash
        run: |
          set -euo pipefail
          cat autopatch/v4.b64.part* | tr -d '\n\r' | base64 -d > /tmp/mobile_autopatch_v4.py
          echo '5ac67939d12c28b17cae440422867102972391efa98b3323fa9de07e93ad8d88  /tmp/mobile_autopatch_v4.py' | sha256sum --check
          cp /tmp/mobile_autopatch_v4.py /tmp/mobile_autopatch_v5.py
          patch /tmp/mobile_autopatch_v5.py < autopatch/v4_to_v5.patch
          echo '68e6cd6ddade4ba22e7b3a7e486aca7efee9fe6a2b8a7aa4af1de130d29ee6b6  /tmp/mobile_autopatch_v5.py' | sha256sum --check
          python -m py_compile /tmp/mobile_autopatch_v4.py /tmp/mobile_autopatch_v5.py autopatch/autopatch_v5_apply.py

      - name: Verify target library
        shell: bash
        run: |
          set -euo pipefail
          echo '5a14855bfdab54000a7724b6935a1191ed654a6b43c2ed514ba54fcc6ae2bb48  input/libmedia_codec_ndk.so' | sha256sum --check
          file input/libmedia_codec_ndk.so

      - name: Run tested v5 driver
        shell: bash
        run: |
          set -euo pipefail
          python autopatch/autopatch_v5_apply.py \
            input/libmedia_codec_ndk.so \
            byte_36AE84=1 dword_36AF34=3 \
            --core /tmp/mobile_autopatch_v4.py --window 96 \
            -o libmedia_codec_ndk.driver.patched.so \
            --manifest patch_manifest_v5_driver.json \
            | tee autopatch_v5_driver.log

      - name: Run standalone v5
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/mobile_autopatch_v5.py \
            input/libmedia_codec_ndk.so \
            byte_36AE84=1 dword_36AF34=3 \
            --window 96 --context 0 --apply \
            -o libmedia_codec_ndk.patched.so \
            --json-report standalone_v5_report.json \
            | tee standalone_v5.log
          file libmedia_codec_ndk.patched.so
          readelf -h libmedia_codec_ndk.patched.so >/dev/null

      - name: Independently verify standalone output
        shell: bash
        run: |
          set -euo pipefail
          cmp libmedia_codec_ndk.driver.patched.so libmedia_codec_ndk.patched.so
          echo 'dfbdc949dfbaeda4d3095d15f34663d7b0fa6a10eb69a1cf4ef3133106192732  libmedia_codec_ndk.patched.so' | sha256sum --check
          python - <<'PY' | tee standalone_v5_verify.log
          import json
          from pathlib import Path
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN
          src = Path('input/libmedia_codec_ndk.so').read_bytes()
          out = Path('libmedia_codec_ndk.patched.so').read_bytes()
          r = json.loads(Path('standalone_v5_report.json').read_text())
          plans = [p for t in r['targets'] for p in t.get('read_force_patch_plan', [])]
          assert r['apply']['patched_instruction_count'] == 9
          assert len(plans) == 9
          expected = bytearray(src)
          md = Cs(CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN)
          for p in plans:
              off = int(p['instruction_file_offset'])
              rva = int(p['instruction_rva'])
              repl = bytes.fromhex(p['replacement_bytes_le'])
              expected[off:off+4] = repl
              ins = list(md.disasm(out[off:off+4], rva))
              assert len(ins) == 1 and ins[0].mnemonic == 'mov'
              print(f"0x{rva:X}: {ins[0].mnemonic} {ins[0].op_str}")
          assert bytes(expected) == out
          assert r['apply']['sha256_before'] == '5a14855bfdab54000a7724b6935a1191ed654a6b43c2ed514ba54fcc6ae2bb48'
          assert r['apply']['sha256_after'] == 'dfbdc949dfbaeda4d3095d15f34663d7b0fa6a10eb69a1cf4ef3133106192732'
          print('standalone == driver: OK')
          print('byte-for-byte expected image: OK')
          PY

      - name: Upload final candidate
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: autopatch-standalone-v5-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            libmedia_codec_ndk.patched.so
            standalone_v5_report.json
            standalone_v5.log
            standalone_v5_verify.log
          if-no-files-found: warn
          retention-days: 4
