name: Analyze native library v5.5 reconstructed C

on:
  push:
    paths:
      - 'input/**/*.so'
      - 'ghidra_scripts/**'
      - 'tools/**'
      - 'ida/**'
      - '.github/workflows/analyze-native-v55.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Optional .so path under input/. Blank = largest library.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-ghidra-v55-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GHIDRA_VERSION: '12.1.3'
      GHIDRA_ZIP: 'ghidra_12.1.3_PUBLIC_20260817.zip'
      GHIDRA_SHA256: '93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54'
      GHIDRA_URL: 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip'

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file unzip graphviz
          python -m pip install --disable-pip-version-check pyelftools
      - uses: actions/cache@v5
        with:
          path: ~/.cache/mobile-ghidra/${{ env.GHIDRA_ZIP }}
          key: ghidra-${{ runner.os }}-${{ env.GHIDRA_VERSION }}-${{ env.GHIDRA_SHA256 }}
      - name: Prepare Ghidra
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/mobile-ghidra" "$RUNNER_TEMP/ghidra"
          ZIP="$HOME/.cache/mobile-ghidra/$GHIDRA_ZIP"
          [[ -f "$ZIP" ]] || curl --fail --location --retry 3 --retry-delay 2 "$GHIDRA_URL" -o "$ZIP"
          echo "$GHIDRA_SHA256  $ZIP" | sha256sum --check -
          unzip -q "$ZIP" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_HOME="$RUNNER_TEMP/ghidra/ghidra_${GHIDRA_VERSION}_PUBLIC"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
      - name: V5.5 deep analysis
        env:
          MANUAL_TARGET: ${{ inputs.target || '' }}
        run: |
          set -euo pipefail
          TARGET="$MANUAL_TARGET"
          if [[ -n "$TARGET" ]]; then
            [[ "$TARGET" == input/* && "$TARGET" == *.so ]] || { echo "target must be under input/ and end in .so" >&2; exit 2; }
            test -f "$TARGET"
          else
            TARGET="$(find input -type f -name '*.so' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          fi
          test -f "$TARGET"
          mkdir -p output "$RUNNER_TEMP/projects"
          SHA="$(sha256sum "$TARGET" | awk '{print $1}')"
          SHORT="${SHA:0:12}"
          BASE="$(basename "$TARGET")"
          SAFE_BASE="$(printf '%s' "$BASE" | tr -cs 'A-Za-z0-9._-' '_')"
          OUT="$GITHUB_WORKSPACE/output/${SAFE_BASE}-${SHORT}"
          mkdir -p "$OUT"
          printf '%s\n' "$TARGET" > "$OUT/source_path.txt"
          printf '%s\n' "$SHA" > "$OUT/sha256.txt"
          python tools/preflight_obfuscation.py "$TARGET" "$OUT" > "$OUT/preflight.log" 2>&1 || true
          ANALYZE="$(head -1 "$OUT/analysis_target.txt" 2>/dev/null || true)"
          if [[ -z "$ANALYZE" || ! -f "$ANALYZE" ]]; then
            printf 'preflight-only: no static ELF recovered\n' > "$OUT/status.txt"
            exit 0
          fi
          [[ "$ANALYZE" = /* ]] && IMPORT="$ANALYZE" || IMPORT="$GITHUB_WORKSPACE/$ANALYZE"
          file "$IMPORT" > "$OUT/file.txt" 2>&1 || true
          readelf -h "$IMPORT" > "$OUT/readelf_header.txt" 2>&1 || true
          readelf -lW "$IMPORT" > "$OUT/readelf_segments.txt" 2>&1 || true
          readelf -SW "$IMPORT" > "$OUT/readelf_sections.txt" 2>&1 || true
          readelf -dW "$IMPORT" > "$OUT/readelf_dynamic.txt" 2>&1 || true
          readelf -rW "$IMPORT" > "$OUT/readelf_relocations.txt" 2>&1 || true
          readelf -sW "$IMPORT" > "$OUT/readelf_symbols.txt" 2>&1 || true
          nm -D -C --defined-only "$IMPORT" > "$OUT/exports.txt" 2>&1 || true
          nm -D -C --undefined-only "$IMPORT" > "$OUT/imports.txt" 2>&1 || true
          strings -a -n 4 "$IMPORT" > "$OUT/raw_strings.txt" 2>&1 || true
          python tools/elf_report.py "$IMPORT" "$OUT/elf_metadata.json" > "$OUT/elf_report.log" 2>&1 || true
          PROJECT="v55_${SHORT}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          bash tools/run_v55_pipeline.sh "$GHIDRA_HOME" "$RUNNER_TEMP/projects" "$PROJECT" "$IMPORT" "$OUT"
          printf 'complete\n' > "$OUT/status.txt"
      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          for d in output/*/; do
            [[ -d "$d" ]] || continue
            echo '# Mobile Ghidra Lab V5.5' >> "$GITHUB_STEP_SUMMARY"
            [[ -f "${d}status.txt" ]] && echo "- Status: $(cat "${d}status.txt")" >> "$GITHUB_STEP_SUMMARY"
            for f in v52_priority.md v54_protected_pack_report.md v55_reconstruction_report.md v55_ida_interop_report.md v51_quality_report.md; do
              [[ -f "${d}${f}" ]] && { echo >> "$GITHUB_STEP_SUMMARY"; sed -n '1,100p' "${d}${f}" >> "$GITHUB_STEP_SUMMARY"; }
            done
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'Human artifact: open `START_HERE.html`. Reconstructed C is under `reconstructed_c/`; optional IDA bridge is under `ida/`.' >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload human artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ghidra-v55-human-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/*/human/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
      - name: Upload forensic artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ghidra-v55-forensic-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
